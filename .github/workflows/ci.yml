name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      commit:
        type: string
        default: ''
      tag:
        type: string
        default: ''
env:
  UV_PYTHON_INSTALL_REGISTRY: '0'
  UV_PYTHON_INSTALL_BIN: 'false'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.21
          enable-cache: false
      - name: Install locked test dependencies
        run: uv sync --locked --extra parquet --no-install-project --no-build --python 3.14
      - name: Unit and mutation checks
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python tests/check_mutations.py
      - name: Packaging checks
        run: .venv/bin/python -O tests/check_packaging.py
      - name: Build release bundle
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          TAG="$REQUESTED_TAG"
          if [ -z "$TAG" ]; then
            TAG=$(.venv/bin/python -c 'import tomllib; print("v"+tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          fi
          .venv/bin/python scripts/release.py build --tag "$TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
  native:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.21
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/release
      - name: Install locked test dependencies
        run: uv sync --locked --extra parquet --no-install-project --no-build --python 3.14
      - name: Native POSIX tests
        if: runner.os != 'Windows'
        run: |
          set -o pipefail
          mkdir -p test-results
          .venv/bin/python -m unittest discover -s tests -v 2>&1 | tee test-results/unit.log
          .venv/bin/python tests/check_installer.py --release-dir dist/release 2>&1 | tee test-results/install.log
      - name: Parse PowerShell tooling
        if: runner.os == 'Windows'
        run: .venv/Scripts/python.exe tests/check_powershell_syntax.py
      - name: Elevated refusal and standard-token native tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          $engine = "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe"
          # In PowerShell 5.1, redirected native stderr under 'Stop' ends the step at the
          # first line; capture everything first, then judge the child's exit code.
          $ErrorActionPreference = 'Continue'
          $lines = @(& $engine -NoProfile -ExecutionPolicy Bypass -File tests/check_windows_elevation.ps1 2>&1 |
            ForEach-Object { "$_" })
          $probe = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllLines((Join-Path $PWD.Path 'test-results\elevation.log'), [string[]]$lines)
          $lines
          if ($probe -ne 0) { throw "Elevated refusal probe failed ($probe)" }
          & scripts/with_standard_user.ps1 -Script scripts/windows_checks.ps1 -Output test-results/windows.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: native-logs-${{ matrix.os }}
          path: test-results/*
          if-no-files-found: warn
          retention-days: 14
