[build-system]
requires = ["setuptools>=82,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "abs-census-etl"
version = "0.2.0"
description = "Read and export ABS 2021 Census GCP DataPacks"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pandas>=3.0.6,<4",
    "requests>=2.34.2,<3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=26.0.0,<27"]

[project.scripts]
abs-census-etl = "abs_census_etl:cli"

[tool.setuptools]
py-modules = ["abs_census_etl"]

[tool.uv]
required-version = ">=0.12.21"
